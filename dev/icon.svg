<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#192A45" />
    </linearGradient>

    <!-- Document Depth/Gloss Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EDF8" />
    </linearGradient>
    
    <linearGradient id="backDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5E5F5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A9C7E4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Upward Trend Gradient (The Progress Arrow) -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#127C44" />
      <stop offset="100%" stop-color="#00FFA2" />
    </linearGradient>

    <!-- Highlight gradients for 'Active' elements -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>

    <linearGradient id="accentYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Layer Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="15" flood-color="#05080E" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background (Rounded Square with 10% outer safe area) -->
  <rect width="1024" height="1024" rx="140" fill="url(#bgGrad)" />

  <!-- Background workflow / connectivity nodes -->
  <g stroke="#3A5375" stroke-width="6" fill="none" opacity="0.6">
    <path d="M 240 280 L 160 280 L 160 400" stroke-dasharray="10 6" />
    <path d="M 860 400 L 860 280 L 780 280" stroke-dasharray="10 6" />
    <circle cx="240" cy="280" r="10" fill="#3A5375" />
    <circle cx="160" cy="400" r="10" fill="#3A5375" />
    <circle cx="780" cy="280" r="10" fill="#3A5375" />
    <circle cx="860" cy="400" r="10" fill="#3A5375" />
  </g>

  <!-- Group with safe margin & dropshadow -->
  <g filter="url(#dropShadow)" transform="translate(4, -10)">

    <!-- 2. The Document Stack (Background / Offset Document) -->
    <path d="M 330 200 H 640 L 740 300 V 780 C 740 802 722 820 700 820 H 330 C 308 820 290 802 290 780 V 240 C 290 218 308 200 330 200 Z" fill="url(#backDocGrad)" />
    <!-- Back document page fold -->
    <path d="M 640 200 L 740 300 H 660 C 649 300 640 291 640 280 V 200 Z" fill="#7FA2C7" />

    <!-- 3. The Main Forefront Document ("Plain Files") -->
    <path d="M 280 250 H 550 L 650 350 V 820 C 650 842 632 860 610 860 H 280 C 258 860 240 842 240 820 V 290 C 240 268 258 250 280 250 Z" fill="url(#docGrad)" />
    <!-- Folding page corner -->
    <path d="M 550 250 L 650 350 H 570 C 559 350 550 341 550 330 V 250 Z" fill="#A2C3E2" />

    <!-- 4. Text/Metadata Visuals inside main Doc (Task Lists, Lines) -->
    <g fill="#4A6585" opacity="0.8">
      <!-- Checked Lists -->
      <rect x="290" y="320" width="100" height="16" rx="8" fill="#1C304A" />
      <circle cx="298" cy="385" r="12" fill="#3B82F6" opacity="0.2" />
      <path d="M 292 385 L 296 389 L 304 381" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="325" y="377" width="160" height="16" rx="8" fill="#5F7D9E" />
      
      <circle cx="298" cy="435" r="12" fill="#22C55E" opacity="0.2" />
      <path d="M 292 435 L 296 439 L 304 431" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="325" y="427" width="190" height="16" rx="8" fill="#5F7D9E" />

      <!-- Horizontal content blocks / mock markup -->
      <rect x="290" y="485" width="225" height="12" rx="6" opacity="0.4" />
      <rect x="290" y="515" width="140" height="12" rx="6" opacity="0.4" />
    </g>

    <!-- 5. Secondary Overlay: PMO Board Component ("Visual PMO Workflow") -->
    <g transform="translate(140, 560)" filter="url(#dropShadow)">
      <!-- Board card -->
      <rect x="180" y="20" width="220" height="150" rx="20" fill="#FFFFFF" />
      <rect x="180" y="20" width="220" height="35" rx="20" fill="#D3E5F6" />
      <rect x="180" y="35" width="220" height="20" fill="#D3E5F6" />
      <!-- Board Content: Tiny progress cards and statuses -->
      <circle cx="205" cy="38" r="8" fill="#4B90E2" />
      <rect x="225" y="34" width="70" height="10" rx="5" fill="#4A6585" />
      
      <rect x="200" y="75" width="60" height="16" rx="8" fill="#34D399" />
      <rect x="270" y="75" width="110" height="16" rx="8" fill="#E2E8F0" />
      
      <rect x="200" y="105" width="85" height="16" rx="8" fill="#FB7185" />
      <rect x="295" y="105" width="85" height="16" rx="8" fill="#E2E8F0" />

      <rect x="200" y="135" width="130" height="12" rx="6" fill="#94A3B8" />
    </g>

    <!-- 6. Connective Lines & Workflow Nodes (Visual Coordination) -->
    <g stroke="#3A5375" stroke-width="6" fill="none" opacity="0.9">
      <path d="M 520 620 L 640 620" />
      <path d="M 640 620 L 640 500" />
    </g>

    <!-- 7. PMO Target / Milestone (The Hub) -->
    <g transform="translate(680, 530)" filter="url(#dropShadow)">
      <!-- Target Outer Ring -->
      <circle cx="0" cy="0" r="70" fill="url(#accentOrange)" />
      <circle cx="0" cy="0" r="50" fill="#FFFFFF" />
      <!-- Target Inner bulls eye -->
      <circle cx="0" cy="0" r="34" fill="url(#accentYellow)" />
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="6" fill="#FF5100" />
      
      <!-- Tiny connector node -->
      <line x1="-70" y1="0" x2="-110" y2="0" stroke="#FF5100" stroke-width="8" stroke-linecap="round" />
      <circle cx="-110" cy="0" r="10" fill="#FFD60A" />
    </g>

    <!-- 8. Front Milestone Progression Arrow (Active Goal Path) -->
    <g filter="url(#glow)">
      <!-- Dimension Layer Backing for 3D/Shadow effect -->
      <path d="M 195 790 L 390 560 L 520 670 L 805 230 L 815 360 L 805 230 L 680 245" stroke="#0A3C20" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
      
      <!-- Primary Green Visual Progress Arrow -->
      <path id="trendArrow" d="M 200 780 L 390 550 L 520 660 L 795 240" stroke="url(#arrowGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Arrow Pointer Details -->
      <path d="M 795 240 L 685 245 M 795 240 L 785 350" stroke="url(#arrowGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            
      <!-- Arrow Highlights -->
      <path d="M 200 780 L 390 550 L 520 660 L 795 240" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" />
    </g>

    <!-- Decorative Nodes along Arrow Progress to lock down 'Milestones' -->
    <circle cx="390" cy="550" r="16" fill="#FFFFFF" filter="url(#dropShadow)" />
    <circle cx="390" cy="550" r="8" fill="#127C44" />
    
    <circle cx="520" cy="660" r="16" fill="#FFFFFF" filter="url(#dropShadow)" />
    <circle cx="520" cy="660" r="8" fill="#127C44" />

  </g>
</svg>
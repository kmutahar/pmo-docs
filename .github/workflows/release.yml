# On a version tag (pushed by dev/release): zip the skill and publish a GitHub release.
# The release notes are this version's section of CHANGELOG.md (generated by git-cliff).
# After the release succeeds, `main` is fast-forwarded to the tagged commit (installs follow `main`).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build zip and notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(python3 -c 'import json; print(json.load(open("skills/pmo-docs/.claude-plugin/plugin.json", encoding="utf-8"))["version"])')" = "$v" || { echo "plugin.json version is not $v"; exit 1; }
          grep -qF "version: \"$v\"" skills/pmo-docs/SKILL.md || { echo "SKILL.md version is not $v"; exit 1; }
          grep -qF "pmo-docs/v$v/" docs/INSTALL_FOR_AGENTS.md || { echo "INSTALL_FOR_AGENTS.md version is not $v"; exit 1; }
          git archive --format=zip --prefix=pmo-docs/ -o "pmo-docs-$v.zip" "$GITHUB_REF_NAME:skills/pmo-docs"
          # the section from "## [$v]" up to the next "## [" heading
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $v in CHANGELOG.md"; exit 1; }
      - name: Run unit tests
        run: python3 -m unittest discover tests
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "pmo-docs-${GITHUB_REF_NAME#v}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md
  fast-forward-main:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tag
        run: |
          git fetch origin main dev
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/dev' || { echo "the tagged commit is not on dev"; exit 1; }
          git merge-base --is-ancestor origin/main "$GITHUB_SHA" || { echo "main is not an ancestor of the tag (a commit went to main directly)"; exit 1; }
          git push origin "$GITHUB_SHA:refs/heads/main"

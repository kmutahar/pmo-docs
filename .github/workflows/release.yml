# On a version tag (pushed by dev/release): zip the skill and publish a GitHub release.
# The release notes are this version's section of CHANGELOG.md (generated by git-cliff).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build zip and notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=pmo-docs/ -o "pmo-docs-$v.zip" "$GITHUB_REF_NAME:skills/pmo-docs"
          # the section from "## [$v]" up to the next "## [" heading
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $v in CHANGELOG.md"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "pmo-docs-${GITHUB_REF_NAME#v}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md

# Defaults for every project. pmo/config.yaml in a project holds only what differs.
# Merge rule: maps merge, lists replace, null removes a map entry.
schema_version: 1

project:
  name: null          # asked by setup
  manager: null       # the project manager, asked by setup
  period_format: YYYY-MM
  week_start: monday  # first day of a week: monday to sunday; a week is named by the ISO week of its fourth day

# Folders, relative to the project root.
paths:
  registers: pmo/registers
  views: pmo/views
  templates: pmo/templates
  documents: pmo/documents
  house_rules: pmo/house-rules.md
  # project playbooks that replace the skill playbook of the same path
  playbooks: pmo/playbooks

# Domain: the words of the project that the technical templates need. Both are optional.
# lifecycle_entity: the one thing whose life cycle the entity-lifecycle document describes (for example: order).
# roles: the permission roles of the product, as the code names them (for example: admin, editor, viewer).
domain:
  lifecycle_entity: null
  roles: []

# Technical: what the code-reading drafts need. Both are optional.
# stacks: the stacks the code is built on, named like the files in references/stacks (nextjs, express, ...).
#   A stack with no shipped file gets a stack file in the project playbook folder, written once with the user.
# consumers: names of the systems or teams that call the API, one section each in the integration guide.
technical:
  stacks: []
  consumers: []

# Languages. A project that does not set this block writes English only.
# draft: the code of the language documents are written in. translations: the codes of the other languages.
# Every code has a block: label (short name) and dir (ltr or rtl). Optional keys per language:
#   glossary: approved term list, a Markdown file inside the project; the proposed list sits next to it
#   digits: the ten characters for 0 to 9, when the language does not write 0123456789
#   connectors: the words for of, to and and between two numbers, as in 3 of 5
#   separators: characters used as a decimal or thousands mark between digits (en has the comma; another draft language declares its own)
# Quote a code that YAML would read as something else (no, on, off, yes).
languages:
  draft: en
  translations: []
  en: { label: EN, dir: ltr, separators: "," }

# Vocabulary: the values each entry field may take. An empty list means any value is accepted.
vocab:
  task_status: [not-started, in-progress, blocked, done, dropped]
  risk_status: [open, mitigating, closed, occurred]
  issue_status: [open, in-progress, resolved, closed]
  change_status: [proposed, approved, rejected, implemented]
  decision_status: [proposed, accepted, superseded]
  action_status: [open, done, dropped]
  risk_level: [low, medium, high]
  issue_severity: [low, medium, high, critical]
  rag: [green, amber, red]
  origin: [stated, proposed]
  priority_order: [high, medium, low]   # sort order for priorities, first = most urgent
  requirement_status: [proposed, accepted, implemented, verified, dropped]
  requirement_kind: [functional, quality, constraint]
  test_status: [planned, passed, failed, blocked, skipped]
  test_kind: [acceptance, regression, smoke, exploratory]
  environment_kind: [local, test, staging, production]
  environment_status: [planned, active, retired]

# Registers: file and view name, id prefix, fields, which fields are checked
# against a vocab, which are dates, and which statuses mean the entry is closed.
registers:
  tasks:
    file: tasks.yaml
    view: tasks.md
    prefix: T
    fields: [id, title, team, group, priority, owner, status, due, done_on, period, notes, origin, tests]
    enums: {status: task_status, priority: priority_order, origin: origin}
    dates: [due, done_on]
    # months: fields that hold a month, YYYY-MM
    months: [period]
    refs: {tests: tests}
    closed: [done, dropped]
    # done: statuses that mean finished work (the definition of done; the tasks view lists done tasks with no linked test)
    done: [done]
    # blocked and active: statuses that count as blocked and in progress (generators, RAG)
    blocked: [blocked]
    active: [in-progress]
  priorities:
    file: priorities.yaml
    view: priorities.md
    prefix: P
    fields: [id, title, goals, output, depends_on, blocks, owner, acceptance, accepted_by, accepted_on, status, note, due, origin]
    enums: {status: task_status, origin: origin}
    dates: [due, accepted_on]
    refs: {depends_on: priorities, blocks: priorities}
    closed: [done, dropped]
  milestones:
    file: milestones.yaml
    view: milestones.md
    prefix: M
    fields: [id, title, period, due, status, owner, exit_criteria, depends_on, origin]
    enums: {status: task_status, origin: origin}
    dates: [due]
    refs: {depends_on: milestones}
    months: [period]
    closed: [done, dropped]
  risks:
    file: risks.yaml
    view: risks.md
    prefix: R
    fields: [id, title, description, probability, impact, owner, mitigation, status, origin, raised, closed]
    enums: {status: risk_status, probability: risk_level, impact: risk_level, origin: origin}
    dates: [raised, closed]
    closed: [closed, occurred]
  issues:
    file: issues.yaml
    view: issues.md
    prefix: I
    fields: [id, title, description, severity, owner, status, origin, raised, resolved, related_tasks]
    enums: {status: issue_status, severity: issue_severity, origin: origin}
    dates: [raised, resolved]
    refs: {related_tasks: tasks}
    closed: [resolved, closed]
  assumptions:
    file: assumptions.yaml
    view: assumptions.md
    prefix: A
    fields: [id, text, owner, status, validate_by, origin]
    enums: {origin: origin}
    dates: [validate_by]
  dependencies:
    file: dependencies.yaml
    view: dependencies.md
    prefix: D
    fields: [id, type, from, to, text, status, origin]
    enums: {origin: origin}
  decisions:
    file: decisions.yaml
    view: decisions.md
    prefix: DEC
    fields: [id, title, context, decision, options, consequences, decided_by, date, status, supersedes, related, origin]
    enums: {status: decision_status, origin: origin}
    dates: [date]
    refs: {supersedes: decisions, related: decisions}
    closed: [accepted, superseded]
    # pending: statuses that need a decision (the Blockers table of the status report)
    pending: [proposed]
  actions:
    file: actions.yaml
    view: actions.md
    prefix: ACT
    fields: [id, text, owner, due, status, source, origin]
    enums: {status: action_status, origin: origin}
    dates: [due]
    closed: [done, dropped]
  changes:
    file: changes.yaml
    view: changes.md
    prefix: CR
    fields: [id, title, requested_by, date, description, impact, status, decided_by, decided_on, related_tasks, origin]
    enums: {status: change_status, origin: origin}
    dates: [date, decided_on]
    refs: {related_tasks: tasks}
    closed: [approved, rejected, implemented]
    # accepted: statuses that count as agreed scope changes (project-plan change log)
    accepted: [approved, implemented]
    # pending: statuses that need a decision (the Blockers table of the status report)
    pending: [proposed]
  meetings:
    file: meetings.yaml
    view: meetings.md
    prefix: MTG
    fields: [id, title, date, attendees, decisions, actions, minutes_doc, origin]
    enums: {origin: origin}
    dates: [date]
  teams:
    file: teams.yaml
    view: teams.md
    prefix: TM
    fields: [id, order, heading, owners, note, output, origin]
    enums: {origin: origin}
  capacity:
    file: capacity.yaml
    view: capacity.md
    fields: [period, person, working_days, leave_days, notes, origin]
    enums: {origin: origin}
  objectives:
    file: objectives.yaml
    view: objectives.md
    prefix: O
    fields: [id, title, kind, measure, target, due, status, origin]
    enums: {origin: origin}
    dates: [due]
  budget:
    file: budget.yaml
    view: budget.md
    prefix: B
    fields: [id, item, low, medium, high, note, origin]
    enums: {origin: origin}
  roster:
    file: roster.yaml
    view: roster.md
    fields: [slug, name, role, origin]
    enums: {origin: origin}
  # tests, environments and permissions hold names and ids only. Never put a secret value in a register.
  requirements:
    file: requirements.yaml
    view: requirements.md
    prefix: REQ
    fields: [id, title, description, kind, priority, source, owner, acceptance, status, related_tasks, origin]
    enums: {kind: requirement_kind, priority: priority_order, status: requirement_status, origin: origin}
    refs: {related_tasks: tasks}
    closed: [verified, dropped]
  tests:
    file: tests.yaml
    view: tests.md
    prefix: TST
    fields: [id, title, kind, requirement, task, issue, expected, status, run_on, owner, evidence, notes, origin]
    enums: {kind: test_kind, status: test_status, origin: origin}
    dates: [run_on]
    refs: {requirement: requirements, task: tasks, issue: issues}
    closed: [passed, skipped]
  environments:
    file: environments.yaml
    view: environments.md
    prefix: ENV
    fields: [id, name, kind, location, branch, deploy, variables, owner, status, notes, origin]
    enums: {kind: environment_kind, status: environment_status, origin: origin}
    closed: [retired]
  permissions:
    file: permissions.yaml
    view: permissions.md
    prefix: PERM
    fields: [id, resource, action, roles, condition, source, notes, origin]
    enums: {roles: domain.roles, origin: origin}

# Doc types. name is the file name; {period} is the month (YYYY-MM) or the week.
# generated_from lists every register the template reads (checked for staleness).
# stale_days: warn when a finished document is older than this many days.
# translate: in-period (default) or after-close, when translations are made. translations: codes that replace languages.translations for this type; [] means none.
doc_types:
  status-report:
    title: Status report
    template: status-report.md
    name: "{period} - {title}.md"
    generated_from: [tasks, milestones, risks, issues, changes, actions, decisions, teams]
    stale_days: 30
    generator: true
    when: every week or month before the status meeting
    regenerate: when tasks or milestones change
  overdue-report:
    title: Overdue report
    template: overdue-report.md
    name: "{period} - {title}.md"
    generated_from: [tasks, milestones, actions, risks, issues]
    translations: []
    publish: false
    when: mid-month or on demand before review meetings
    regenerate: when tasks or actions are updated
  docs-audit-report:
    title: Documentation audit
    template: docs-audit-report.md
    name: "{period} - {title}.md"
    generated_from: []
    translations: []
    publish: false
    when: monthly before project review
    regenerate: after fixing reported issues
  project-plan:
    title: Project plan
    template: project-plan.md
    name: "{title}.md"
    generated_from: [tasks, milestones, priorities, teams, risks, assumptions, dependencies, changes, roster]
    stale_days: 30
    generator: true
    when: at project start and monthly refresh
    regenerate: when priorities or teams change
  project-charter:
    title: Project charter
    template: project-charter.md
    name: "{title}.md"
    generated_from: [objectives, priorities, budget, assumptions, roster]
    stale_days: 90
    when: at project kickoff
    regenerate: never; edit the finished document
  change-request:
    title: Change request
    template: change-request.md
    name: "{date} - {title}.md"
    generated_from: [changes]
    when: whenever a scope or schedule change is proposed
    regenerate: never; edit the finished document
  meeting-minutes:
    title: Meeting minutes
    template: meeting-minutes.md
    name: "{date} - {title}.md"
    generated_from: [meetings, actions, decisions]
    when: after governance and sync meetings
    regenerate: never; edit the finished document
  team-checklist:
    title: Team checklist
    template: team-checklist.md
    name: "{title}.md"
    generated_from: [tasks, teams, milestones]
    stale_days: 14
    generator: true
    when: start of each period
    regenerate: when period tasks change
  roadmap:
    title: Roadmap
    template: roadmap.md
    name: "{title}.md"
    generated_from: [milestones, priorities, dependencies]
    stale_days: 30
    when: quarterly or upon milestone reviews
    regenerate: when milestones or priorities shift
  retrospective:
    title: Retrospective
    template: retrospective.md
    name: "{period} - {title}.md"
    generated_from: [tasks, issues, changes, actions]
    when: end of each period or major delivery phase
    regenerate: never; edit the finished document
  delivery-report:
    title: Delivery report
    template: delivery-report.md
    name: "{period} - {title}.md"
    generated_from: [tasks, milestones, priorities, issues, risks, changes]
    stale_days: 30
    when: at milestone completion or release cutoff
    regenerate: when release tasks or issues close
  capacity-plan:
    title: Capacity plan
    template: capacity-plan.md
    name: "{period} - {title}.md"
    generated_from: [capacity, tasks, roster]
    stale_days: 30
    when: monthly during resource planning
    regenerate: when leave or staffing changes
  weekly-plan:
    title: Weekly plan
    template: weekly-plan.md
    name: "{period} - {title}.md"
    generated_from: [tasks, actions, capacity]
    stale_days: 7
    when: on the first day of each week
    regenerate: when weekly commitments shift
  decision-log:
    title: Decision log
    template: decision-log.md
    name: "{title}.md"
    generated_from: [decisions]
    stale_days: 30
    generator: true
    when: after key technical or architecture decisions
    regenerate: when decisions register is updated
  stakeholder-update:
    title: Stakeholder update
    template: stakeholder-update.md
    name: "{period} - {title}.md"
    generated_from: [tasks, milestones, risks, issues, decisions, changes]
    stale_days: 30
    when: monthly or bi-weekly for executive stakeholders
    regenerate: when milestones or risks change
  release-notes:
    title: Release notes
    template: release-notes.md
    name: "{period} - {title}.md"
    generated_from: [tasks, changes]
    when: for each release or month end
    regenerate: when commits or changes are tagged
  functional-requirements:
    title: Functional requirements
    template: functional-requirements.md
    name: "{title}.md"
    generated_from: [requirements]
    stale_days: 30
    when: Once the requirements are agreed, and before design or test planning starts.
    regenerate: A requirement is added, accepted, changed or dropped.
  test-acceptance:
    title: Test acceptance
    template: test-acceptance.md
    name: "{period} - {title}.md"
    generated_from: [tests, requirements, environments]
    stale_days: 14
    when: Before each acceptance round, and again after it with the results.
    regenerate: A test is added or run, a requirement changes, or an environment changes.
  defect-gap-report:
    title: Defect and gap report
    template: defect-gap-report.md
    name: "{period} - {title}.md"
    generated_from: [tests, issues, requirements]
    stale_days: 30
    when: At the end of a test round, and before a release decision.
    regenerate: A test result, an issue or a requirement changes.
  entity-lifecycle:
    title: Entity lifecycle
    template: entity-lifecycle.md
    name: "{title}.md"
    generated_from: [permissions]
    stale_days: 60
    when: After the first release that changes the entity, and when its rules are disputed.
    regenerate: A state, transition or permission changes in the code or the permissions register.
  api-reference:
    title: API reference
    template: api-reference.md
    name: "{title}.md"
    generated_from: [environments, permissions]
    stale_days: 30
    when: When the API has a first consumer, and before each release that changes an endpoint.
    regenerate: An endpoint, a permission or an environment changes.
  integration-guide:
    title: Integration guide
    template: integration-guide.md
    name: "{title}.md"
    generated_from: [environments, permissions]
    stale_days: 30
    when: Before a new consumer connects.
    regenerate: A consumer is added, an endpoint or an environment changes.
  architecture-overview:
    title: Architecture overview
    template: architecture-overview.md
    name: "{title}.md"
    generated_from: [environments, decisions]
    stale_days: 90
    when: When a new person or team needs the big picture, and after any change of components.
    regenerate: A component, an environment or a decision changes.
  user-guide:
    title: User guide
    template: user-guide.md
    name: "{title}.md"
    generated_from: [requirements, permissions]
    stale_days: 60
    when: Before the product reaches its first users, and when a screen or a role changes.
    regenerate: A screen, a requirement or a permission changes.

# Publishing: copies finished documents with /pmo-docs:publish only.
# mode: none (default, nothing is published), folder (a folder inside this project) or repo (the top folder of
# another local git repository; the command commits there only after a yes and never pushes).
# path: the target folder, relative to the project root or absolute (repo mode only).
# url: optional web address of the target folder, used only to print links.
publish:
  mode: none
  path: null
  url: null

# Schedule: optional list of recurring recipe runs, recorded as a record only.
# Each item has recipe (a known recipe name or project playbook) and when (time description as text).
# Example:
#   - { recipe: weekly-status, when: "Mon 08:00" }
schedule: []

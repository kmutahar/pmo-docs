# git-cliff configuration. Generates CHANGELOG.md from commit messages.
# Docs: https://git-cliff.org/docs/configuration
#
# The repo will be public, so everything here is built from commit subjects only:
# keep subjects free of private names (dev/scrub.sh checks them).
# When pull requests and outside contributors appear, enable the GitHub
# integration (needs GITHUB_TOKEN): add `commit.remote.pr_number` and the
# contributors block to the body, as in git-cliff's `github-keepachangelog` example.

# No [remote.github] section on purpose: it makes git-cliff call the GitHub API (needs a token,
# fails on private repos). Links use the owner and repo from the git remote `origin`.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Generated by git-cliff from commit messages; do not edit by hand.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}

"""
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ self::remote_url() }}/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
# Keep commits that are not conventional; they are grouped by their first word (below).
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_preprocessors = [
    # Remove issue and PR numbers like "(#12)" from subjects.
    { pattern = '\s*\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# First match wins. Groups use the Keep a Changelog names; the "<!-- n -->" prefix
# only fixes the order and is stripped by the template.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    # Keep a Changelog: the changelog is for users, so internal work is left out.
    # A breaking change is never skipped (protect_breaking_commits below).
    { message = "^(chore|ci|test|style|build|refactor)(\\(.*\\))?:", skip = true },
    { message = "^docs\\((plan|dev|memory)\\)", skip = true },
    { message = "^Merge", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "(?i)^(add|support)", group = "<!-- 0 -->Added" },
    { message = "(?i)^deprecat", group = "<!-- 2 -->Deprecated" },
    { message = "(?i)^(security|.*: security)", group = "<!-- 5 -->Security" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "(?i)^(revert|remove|delete)", group = "<!-- 3 -->Removed" },
    { message = "^.*: (remove|delete)", group = "<!-- 3 -->Removed" },
    # Everything else (perf, user docs, unconventional).
    { message = ".*", group = "<!-- 1 -->Changed" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
# Only tags like v0.1.0 count as releases.
tag_pattern = "v[0-9].*"
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

[bump]
# Stay on 0.x while the config format may change: a breaking change bumps the minor, not to 1.0.0.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
